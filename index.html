<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperisoft</title>
<meta name="description" content="Imperisoft — a software practice of one. Systems that hold money and keep their word. Type help, or write to hello@imperisoft.io.">
<meta property="og:title" content="Imperisoft">
<meta property="og:description" content="guest@imperisoft:~$ — systems that hold money and keep their word.">
<meta name="theme-color" content="#0a0b0d">
<style>
  :root {
    --ink: #e7e9ec;
    --ink-soft: #8f97a3;
    --ink-faint: #4d545f;
    --line: #1d2026;
    --page: #0a0b0d;
    --pane: #0e1013;
    --accent: #6d94ff;
    --ok: #7dd3a0;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(80rem 42rem at 75% -22rem, rgba(109, 148, 255, 0.07), transparent 60%),
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(231, 233, 236, 0.045) 50%, transparent 51%);
    background-repeat: no-repeat, repeat;
    background-size: auto, 96px 96px;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--page); }

  .wrap { max-width: 780px; margin: 0 auto; padding: 26px 22px 60px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 18px;
    font-size: 13px;
  }
  .mark { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
  .mark i { font-style: normal; color: var(--accent); }
  header small { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.12em; }

  .term {
    background: var(--pane);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 24px 80px -32px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }
  .term-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
  }
  .term-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .term-bar i:first-child { background: #3a3f47; }
  .term-bar span {
    margin-left: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }
  .term-body {
    padding: 18px 18px 14px;
    min-height: 58vh;
    max-height: 70vh;
    overflow-y: auto;
    cursor: text;
  }
  .out { white-space: pre-wrap; overflow-wrap: break-word; }
  .out .dim { color: var(--ink-faint); }
  .out .soft { color: var(--ink-soft); }
  .out .ok { color: var(--ok); }
  .out .acc { color: var(--accent); }
  .out a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(109,148,255,0.35); }
  .out a:hover { border-bottom-color: var(--accent); }
  .out .cmdlink { cursor: pointer; color: var(--ink); border-bottom: 1px dashed var(--ink-faint); }
  .out .cmdlink:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .prompt-row { display: flex; align-items: baseline; gap: 0; }
  .ps1 { color: var(--ok); white-space: nowrap; }
  .ps1 b { color: var(--accent); font-weight: 400; }
  .cmdline {
    flex: 1;
    min-width: 8ch;
    background: none;
    border: 0;
    outline: none;
    color: var(--ink);
    font: inherit;
    caret-color: var(--accent);
    padding: 0;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chips button {
    font: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 13px;
    cursor: pointer;
  }
  .chips button:hover { color: var(--ink); border-color: var(--ink-faint); }

  footer {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
  }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">Imperisoft<i>.</i></a>
    <small>EST. 2026 · UK</small>
  </header>

  <div class="term" role="application" aria-label="Imperisoft interactive terminal">
    <div class="term-bar" aria-hidden="true">
      <i></i><i></i><i></i>
      <span>guest@imperisoft — zsh</span>
    </div>
    <div class="term-body" id="body">
      <div class="out" id="out"></div>
      <div class="prompt-row">
        <span class="ps1">guest@<b>imperisoft</b>:~$&nbsp;</span>
        <input id="cmd" class="cmdline" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" aria-label="Terminal command input" enterkeyhint="go">
      </div>
    </div>
  </div>

  <div class="chips" aria-label="Shortcuts for the terminal-averse">
    <button data-cmd="whois">whois</button>
    <button data-cmd="work">work</button>
    <button data-cmd="principles">principles</button>
    <button data-cmd="contact">contact</button>
  </div>

  <footer>
    <span>IMPERISOFT LTD · ENGLAND &amp; WALES · NO. 16280545</span>
    <span><a href="mailto:hello@imperisoft.io">HELLO@IMPERISOFT.IO</a></span>
  </footer>

  <noscript>
    <p style="color:#8f97a3; max-width: 40rem;">
      Imperisoft is a UK software practice of one: systems that hold money and
      keep their word. Currently building Motoshift (motoshift.uk). The rest is
      a conversation — hello@imperisoft.io.
    </p>
  </noscript>
</div>

<script>
/* A real terminal, not a film prop: dry output, tab completion, history.
   Everything important is also reachable without typing (the chips), and
   the footer carries the registration whether or not JS runs. */
(() => {
  const out = document.getElementById('out')
  const cmd = document.getElementById('cmd')
  const body = document.getElementById('body')
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  const history = []
  let historyAt = 0

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

  const COMMANDS = {
    help: () => [
      '<span class="dim">Available commands:</span>',
      '  <span class="cmdlink" data-cmd="whois">whois</span>        who is behind this',
      '  <span class="cmdlink" data-cmd="work">work</span>         what is being built',
      '  <span class="cmdlink" data-cmd="stack">stack</span>        what it is built with',
      '  <span class="cmdlink" data-cmd="principles">principles</span>   how it is built',
      '  <span class="cmdlink" data-cmd="contact">contact</span>      start the real conversation',
      '  <span class="cmdlink" data-cmd="clear">clear</span>        clean slate',
    ],
    whois: () => [
      '<span class="acc">Imperisoft Ltd</span> — a software practice of one.',
      '',
      'One engineer. Few projects, taken whole: designed, built,',
      'run in production, and written down well enough to hand over.',
      '',
      '<span class="dim">Registered in England &amp; Wales, no. 16280545.</span>',
    ],
    work: () => [
      '<span class="acc">CURRENTLY</span>  <a href="https://motoshift.uk">motoshift.uk</a>',
      '',
      'A UK marketplace for used motorcycle gear, where the money',
      'waits until the rider is sure: held payments, verified',
      'sellers, declared crash history, disputes that end with a',
      'human decision.',
      '',
      '<span class="dim">29 releases this cycle · 543 automated tests · tag → deploy in minutes</span>',
      '<span class="dim">Everything before this one is under NDA. Ask.</span>',
    ],
    stack: () => [
      'Deliberately boring:',
      '',
      '  Django · PostgreSQL · Redis · Celery · React · Capacitor',
      '',
      '<span class="dim">A new dependency has to earn its place. Most don’t.</span>',
    ],
    principles: () => [
      '01  Boring technology, chosen on purpose.',
      '02  Every decision written down, with its reasons.',
      '03  Migrations that can roll back.',
      '04  Backups proven by restoring them.',
      '05  Documentation is part of done.',
    ],
    contact: () => [
      'The rest doesn’t fit in a terminal.',
      '',
      '  <a href="mailto:hello@imperisoft.io">hello@imperisoft.io</a>',
      '',
      '<span class="dim">Plain email. A human replies.</span>',
    ],
    ls: () => ['manifest.txt   work/   <span class="dim">.secrets  (permission denied)</span>'],
    'cat manifest.txt': () => COMMANDS.principles(),
    'cat .secrets': () => ['cat: .secrets: <span class="dim">nice try. earn it:</span> <a href="mailto:hello@imperisoft.io">hello@imperisoft.io</a>'],
    'sudo hire': () => [
      '<span class="ok">[sudo] permission granted.</span>',
      '',
      'Capacity: one engagement at a time.',
      'Next step: <a href="mailto:hello@imperisoft.io">hello@imperisoft.io</a>',
    ],
    whoami: () => ['guest. <span class="dim">For now.</span>'],
    pwd: () => ['/home/guest/somewhere-worth-being'],
    exit: () => ['<span class="dim">There is no exit. There is only</span> <span class="cmdlink" data-cmd="contact">contact</span><span class="dim">.</span>'],
    clear: () => { out.innerHTML = ''; return [] },
  }
  COMMANDS.motoshift = COMMANDS.work
  COMMANDS.hire = COMMANDS['sudo hire']
  COMMANDS.email = COMMANDS.contact

  function print(lines) {
    if (!lines.length) return
    const div = document.createElement('div')
    div.innerHTML = lines.join('\n') + '\n\n'
    out.appendChild(div)
    body.scrollTop = body.scrollHeight
  }

  function echoPrompt(text) {
    print(['<span class="ok">guest@<span class="acc">imperisoft</span>:~$</span> ' + esc(text)])
  }

  function run(raw) {
    const text = raw.trim()
    echoPrompt(text)
    if (!text) return
    history.push(text)
    historyAt = history.length
    const handler = COMMANDS[text.toLowerCase()]
    if (handler) print(handler())
    else print([`zsh: command not found: ${esc(text)}`, '<span class="dim">try</span> <span class="cmdlink" data-cmd="help">help</span>'])
  }

  cmd.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { run(cmd.value); cmd.value = '' }
    else if (e.key === 'ArrowUp') { if (historyAt > 0) cmd.value = history[--historyAt]; e.preventDefault() }
    else if (e.key === 'ArrowDown') {
      cmd.value = historyAt < history.length - 1 ? history[++historyAt] : ((historyAt = history.length), '')
      e.preventDefault()
    } else if (e.key === 'Tab') {
      e.preventDefault()
      const part = cmd.value.toLowerCase()
      if (!part) return
      const match = Object.keys(COMMANDS).filter((c) => c.startsWith(part))
      if (match.length === 1) cmd.value = match[0]
      else if (match.length > 1) print(['<span class="dim">' + match.join('   ') + '</span>'])
    }
  })

  body.addEventListener('click', () => {
    if (!getSelection().toString()) cmd.focus()
  })
  document.addEventListener('click', (e) => {
    const link = e.target.closest('.cmdlink, .chips button')
    if (link) { run(link.dataset.cmd); cmd.focus() }
  })

  // Boot: a couple of quiet lines, then help — typed, unless motion is off.
  const boot = [
    '<span class="dim">imperisoft.io — session opened. this terminal is real; so is the work.</span>',
    '',
  ]
  print(boot)
  const intro = 'help'
  if (reduced) { run(intro) }
  else {
    let i = 0
    const type = () => {
      if (i <= intro.length) {
        cmd.value = intro.slice(0, i++)
        setTimeout(type, 65 + Math.random() * 60)
      } else {
        setTimeout(() => { run(intro); cmd.value = '' }, 220)
      }
    }
    setTimeout(type, 500)
  }
  cmd.focus()
})()
</script>
</body>
</html>
