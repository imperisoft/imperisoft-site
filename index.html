<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperisoft</title>
<meta name="description" content="Imperisoft — systems that hold money and keep their word. Type help, or write to hello@imperisoft.io.">
<meta property="og:title" content="Imperisoft">
<meta property="og:description" content="guest@imperisoft:~$ — systems that hold money and keep their word.">
<meta name="theme-color" content="#0a0b0d">
<style>
  :root {
    --ink: #e7e9ec;
    --ink-soft: #8f97a3;
    --ink-faint: #4d545f;
    --line: #1d2026;
    --page: #0a0b0d;
    --pane: #0e1013;
    --accent: #6d94ff;
    --ok: #7dd3a0;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(80rem 42rem at 75% -22rem, rgba(109, 148, 255, 0.07), transparent 60%),
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(231, 233, 236, 0.045) 50%, transparent 51%);
    background-repeat: no-repeat, repeat;
    background-size: auto, 96px 96px;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--page); }

  .wrap { max-width: 780px; margin: 0 auto; padding: 26px 22px 60px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 18px;
    font-size: 13px;
  }
  .mark { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
  .mark i { font-style: normal; color: var(--accent); }
  header small { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.12em; }

  .term {
    background: var(--pane);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 24px 80px -32px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }
  .term-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
  }
  .term-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .term-bar i:first-child { background: #3a3f47; }
  .term-bar span {
    margin-left: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }
  .term-body {
    padding: 18px 18px 14px;
    min-height: 58vh;
    max-height: 70vh;
    overflow-y: auto;
    cursor: text;
  }
  .out { white-space: pre-wrap; overflow-wrap: break-word; }
  .out .dim { color: var(--ink-faint); }
  .out .soft { color: var(--ink-soft); }
  .out .ok { color: var(--ok); }
  .out .acc { color: var(--accent); }
  .out a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(109,148,255,0.35); }
  .out a:hover { border-bottom-color: var(--accent); }
  .out .cmdlink { cursor: pointer; color: var(--ink); border-bottom: 1px dashed var(--ink-faint); }
  .out .cmdlink:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .prompt-row { display: flex; align-items: baseline; gap: 0; }
  .ps1 { color: var(--ok); white-space: nowrap; }
  .ps1 b { color: var(--accent); font-weight: 400; }
  .cmdline {
    flex: 1;
    min-width: 8ch;
    background: none;
    border: 0;
    outline: none;
    color: var(--ink);
    font: inherit;
    caret-color: var(--accent);
    padding: 0;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chips button {
    font: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 13px;
    cursor: pointer;
  }
  .chips button:hover { color: var(--ink); border-color: var(--ink-faint); }

  footer {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
  }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">Imperisoft<i>.</i></a>
    <small>EST. 2026 · UK</small>
  </header>

  <div class="term" role="application" aria-label="Imperisoft interactive terminal">
    <div class="term-bar" aria-hidden="true">
      <i></i><i></i><i></i>
      <span>guest@imperisoft — zsh</span>
    </div>
    <div class="term-body" id="body">
      <div class="out" id="out"></div>
      <div class="prompt-row">
        <span class="ps1" id="ps1">guest@<b>imperisoft</b>:~$&nbsp;</span>
        <input id="cmd" class="cmdline" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" aria-label="Terminal command input" enterkeyhint="go">
      </div>
    </div>
  </div>

  <div class="chips" aria-label="Shortcuts for the terminal-averse">
    <button data-cmd="whois">whois</button>
    <button data-cmd="services">services</button>
    <button data-cmd="work">work</button>
    <button data-cmd="principles">principles</button>
    <button data-cmd="contact">contact</button>
  </div>

  <footer>
    <span>IMPERISOFT LTD · ENGLAND &amp; WALES · NO. 16280545</span>
    <span><a href="mailto:hello@imperisoft.io">HELLO@IMPERISOFT.IO</a></span>
  </footer>

  <noscript>
    <p style="color:#8f97a3; max-width: 40rem;">
      Imperisoft is a UK software company: systems that hold money and keep
      their word. Currently building Motoshift (motoshift.uk). The rest is a
      conversation — hello@imperisoft.io.
    </p>
  </noscript>
</div>

<script>
/* A real terminal with a small read-only filesystem. Everything important is
   also reachable without typing (the chips), and the footer carries the
   registration whether or not JS runs. The dry jokes are load-bearing:
   curiosity is the qualification we hire clients by — and the machine
   notices it. */
(() => {
  const out = document.getElementById('out')
  const cmd = document.getElementById('cmd')
  const body = document.getElementById('body')
  const ps1 = document.getElementById('ps1')
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

  const store = {
    get(k) { try { return localStorage.getItem(k) } catch { return null } },
    set(k, v) { try { localStorage.setItem(k, v) } catch {} },
  }

  let history = []
  try { history = JSON.parse(store.get('ims-history') || '[]') } catch {}
  let historyAt = history.length
  let inVim = false
  const seen = new Set()
  let noticed = store.get('ims-noticed') === '1'
  const returning = store.get('ims-visited') === '1'
  store.set('ims-visited', '1')

  const esc = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  const MAIL = '<a href="mailto:hello@imperisoft.io">hello@imperisoft.io</a>'

  /* ---------- the filesystem ---------- */

  const FS = {
    'README.txt': [
      '<span class="acc">IMPERISOFT LTD</span>',
      '',
      'Systems that hold money and keep their word.',
      'Few projects, taken whole: designed, built, run in',
      'production, and written down well enough to hand over.',
      '',
      'Who builds them is a conversation, not a webpage.',
      '',
      '<span class="dim">Registered in England &amp; Wales, no. 16280545.</span>',
    ],
    'services.txt': [
      '<span class="dim">SERVICES — scope is agreed in private.</span>',
      '',
      '  01  <span class="acc">PRODUCT</span>       things people use, built end to end',
      '  02  <span class="acc">PLATFORMS</span>     marketplaces · money held in trust · disputes',
      '  03  <span class="acc">OPERATIONS</span>    it runs, it is watched, it comes back',
      '  04  <span class="acc">RESCUE</span>        systems nobody can explain any more',
      '',
      '<span class="dim">Next step:</span> ' + MAIL,
    ],
    'stack.txt': [
      '<span class="dim">Boring on purpose. In production over the years:</span>',
      '',
      '  <span class="acc">BACKEND</span>    Python · Django · PostgreSQL · Redis · Celery',
      '  <span class="acc">FRONTEND</span>   TypeScript · React · Next.js · Tailwind',
      '  <span class="acc">MOBILE</span>     Capacitor → the app stores',
      '  <span class="acc">INFRA</span>      Terraform · Docker · Nginx · Cloudflare',
      '  <span class="acc">ALSO</span>       multi-tenant platforms · payment rails ·',
      '             SEO tooling · a token experiment we don’t talk about',
      '',
      '<span class="dim">A new tool has to earn its place. Most don’t.</span>',
    ],
    'manifest.txt': [
      '01  Boring technology, chosen on purpose.',
      '02  Every decision written down, with its reasons.',
      '03  Migrations that can roll back.',
      '04  Backups proven by restoring them.',
      '05  Documentation is part of done.',
    ],
    'work': {
      'motoshift.txt': [
        '<span class="acc">CURRENTLY</span>  <a href="https://motoshift.uk">motoshift.uk</a>',
        '',
        'A UK marketplace for used motorcycle gear, where the money',
        'waits until the rider is sure: held payments, verified',
        'sellers, declared crash history, disputes that end with a',
        'human decision.',
        '',
        '<span class="dim">29 releases this cycle · 543 automated tests · tag → deploy in minutes</span>',
      ],
      'archive': {
        '2019-2025.tar.enc': [
          '<span class="dim">[binary — AES-256]</span>',
          '',
          'Encrypted at rest. The key is a conversation: ' + MAIL,
        ],
      },
    },
    'notes': {
      'on-boring-technology.txt': [
        'Excitement belongs in the product,',
        'never in the pager.',
      ],
      'on-handover.txt': [
        'If it cannot be handed over, it is not finished.',
        'Software you are hostage to is not an asset.',
      ],
      'todo.txt': [
        '[x] build it',
        '[x] ship it',
        '[x] run it',
        '[ ] sleep',
      ],
    },
    '.secrets': ['cat: .secrets: <span class="dim">nice try. earn it:</span> ' + MAIL],
    '.plan': ['ship. run. keep your word.'],
    '.zsh_history': [
      'vim',
      ':q',
      ':q!',
      'sudo hire',
      'cat work/archive/2019-2025.tar.enc',
      '<span class="dim">…the rest is redacted.</span>',
    ],
    '.ssh': {},
  }

  let cwd = []

  const nodeAt = (segs) => segs.reduce((n, seg) => (n && typeof n === 'object' && !Array.isArray(n) ? n[seg] : undefined), FS)
  const isDir = (n) => n && typeof n === 'object' && !Array.isArray(n)
  const cwdStr = () => '~' + (cwd.length ? '/' + cwd.join('/') : '')

  function resolve(path) {
    if (!path || path === '~') return []
    let segs = path.startsWith('~/') ? [] : [...cwd]
    if (path.startsWith('~/')) path = path.slice(2)
    for (const part of path.split('/')) {
      if (!part || part === '.') continue
      if (part === '..') segs.pop()
      else segs.push(part)
    }
    return segs
  }

  function refreshPrompt() {
    ps1.innerHTML = 'guest@<b>imperisoft</b>:' + esc(cwdStr()) + '$&nbsp;'
  }

  const strip = (line) => line.replace(/<[^>]*>/g, '')
  const READONLY = (tool) =>
    [`${tool}: <span class="dim">read-only filesystem. writing is not permitted on this host.</span>`]

  function fileLines(arg, tool) {
    if (!arg) return { err: [`${tool}: which file? <span class="dim">(ls is free)</span>`] }
    const node = nodeAt(resolve(arg))
    if (node === undefined) return { err: [`${tool}: ${esc(arg)}: no such file or directory`] }
    if (isDir(node)) return { err: [`${tool}: ${esc(arg)}: is a directory`] }
    return { lines: node }
  }

  /* ---------- fs tools ---------- */

  function ls(arg) {
    const all = /(^|\s)-a(\s|$)/.test(arg || '')
    const target = (arg || '').replace(/(^|\s)-a(\s|$)/, ' ').trim()
    const node = nodeAt(resolve(target))
    if (node === undefined) return [`ls: ${esc(target)}: no such file or directory`]
    if (!isDir(node)) return [esc(target)]
    const names = Object.keys(node)
      .filter((n) => all || !n.startsWith('.'))
      .sort()
      .map((n) => (isDir(node[n]) ? `<span class="acc">${n}/</span>` : n))
    if (all) names.unshift('<span class="dim">./  ../</span>')
    return [names.join('   ') || '<span class="dim">(empty. for now.)</span>']
  }

  function cd(arg) {
    if (arg === '.ssh' || (arg || '').endsWith('/.ssh')) {
      return ['cd: .ssh: <span class="dim">permission denied (publickey). obviously.</span>']
    }
    const segs = resolve(arg || '~')
    const node = nodeAt(segs)
    if (node === undefined) return [`cd: ${esc(arg)}: no such file or directory`]
    if (!isDir(node)) return [`cd: ${esc(arg)}: not a directory`]
    cwd = segs
    refreshPrompt()
    return []
  }

  function cat(args) {
    if (!args.length) return ['cat: which file? <span class="dim">(ls is free)</span>']
    const chunks = []
    for (const f of args) {
      const { lines, err } = fileLines(f, 'cat')
      chunks.push(...(err || lines))
    }
    return chunks
  }

  function tree(node = FS, prefix = '') {
    const lines = prefix === '' ? ['<span class="dim">~</span>'] : []
    const names = Object.keys(node).filter((n) => !n.startsWith('.')).sort()
    names.forEach((name, i) => {
      const last = i === names.length - 1
      const branch = last ? '└── ' : '├── '
      const child = node[name]
      lines.push(prefix + branch + (isDir(child) ? `<span class="acc">${name}/</span>` : name))
      if (isDir(child)) lines.push(...tree(child, prefix + (last ? '    ' : '│   ')))
    })
    if (prefix === '') lines.push('', '<span class="dim">hidden files are hidden for a reason. ls -a.</span>')
    return lines
  }

  function nano(arg) {
    const { lines, err } = fileLines(arg, 'nano')
    if (err) return err
    const name = arg.split('/').pop()
    return [
      `<span class="dim">GNU nano 7.2</span>              ${esc(name)}              <span class="acc">[Read Only]</span>`,
      '<span class="dim">──────────────────────────────────────────────</span>',
      ...lines,
      '<span class="dim">──────────────────────────────────────────────</span>',
      '<span class="dim">^X Exit   ^O Write Out (disabled on this host)   ^W Where Is</span>',
      '',
      '<span class="dim">nano exited: nothing was saved. nothing ever is.</span>',
    ]
  }

  /* ---------- named commands ---------- */

  const COMMANDS = {
    help: () => [
      '<span class="dim">Available commands:</span>',
      '  <span class="cmdlink" data-cmd="whois">whois</span>        who is behind this',
      '  <span class="cmdlink" data-cmd="services">services</span>     what can be commissioned',
      '  <span class="cmdlink" data-cmd="work">work</span>         what is being built',
      '  <span class="cmdlink" data-cmd="principles">principles</span>   how it is built',
      '  <span class="cmdlink" data-cmd="contact">contact</span>      start the real conversation',
      '  <span class="cmdlink" data-cmd="clear">clear</span>        clean slate',
      '',
      '<span class="dim">This machine has a filesystem, and the usual tools mostly work:</span>',
      '<span class="dim">ls, cd, cat, tree, grep, head, nano… Writing is not permitted.</span>',
      '<span class="dim">Curiosity is rewarded.</span>',
    ],
    whois: () => FS['README.txt'],
    services: () => FS['services.txt'],
    work: () => FS.work['motoshift.txt'],
    motoshift: () => FS.work['motoshift.txt'],
    principles: () => FS['manifest.txt'],
    stack: () => FS['stack.txt'],
    contact: () => [
      'The rest doesn’t fit in a terminal.',
      '',
      '  ' + MAIL,
      '',
      '<span class="dim">Plain email. A human replies.</span>',
    ],
    email: () => COMMANDS.contact(),
    'sudo hire': () => [
      '<span class="ok">[sudo] permission granted.</span>',
      '',
      'Capacity: one engagement at a time.',
      'Next step: ' + MAIL,
    ],
    hire: () => COMMANDS['sudo hire'](),
    'sudo su': () => ['su: <span class="dim">root is earned, not typed.</span>'],
    su: () => COMMANDS['sudo su'](),
    whoami: () => ['guest. <span class="dim">For now.</span>'],
    date: () => [new Date().toUTCString() + '  <span class="dim">· ships daily</span>'],
    pwd: () => ['/home/guest' + (cwd.length ? '/' + cwd.join('/') : '')],
    history: () => history.map((h, i) => `  ${String(i + 1).padStart(3)}  ${esc(h)}`),
    exit: () => ['<span class="dim">There is no exit. There is only</span> <span class="cmdlink" data-cmd="contact">contact</span><span class="dim">.</span>'],
    matrix: () => ['<span class="dim">no. we’re professionals.</span>'],
    'ping motoshift.uk': () => [
      'PING motoshift.uk: 64 bytes: <span class="ok">alive</span> <span class="dim">— and taking payments.</span>',
    ],
    ping: () => ['ping: usage: ping motoshift.uk <span class="dim">(the only host that matters here)</span>'],
    'rm -rf /': () => ['rm: <span class="dim">permission denied. and manners.</span>'],
    make: () => ['make: *** No rule to make target ’money’. <span class="dim">There is: </span><span class="cmdlink" data-cmd="services">services</span>'],
    neofetch: () => [
      '<span class="acc">  ██▓</span>   <span class="ok">guest@imperisoft</span>',
      '<span class="acc">  ██▓</span>   ────────────────',
      '<span class="acc">  ██▓</span>   OS:       production, always',
      '<span class="acc">  ██▓</span>   Uptime:   since 2026, unbroken',
      '<span class="acc">  ▀▀▓</span>   Shell:    the one you’re in',
      '<span class="acc">  ██▓</span>   Motto:    keep your word',
    ],
    finger: () => ['Login: guest', 'Plan:', ...FS['.plan']],
    'finger guest': () => COMMANDS.finger(),
    uptime: () => ['up since 2026, unbroken <span class="dim">· load average: one engagement at a time</span>'],
    env: () => [
      'USER=guest', 'HOST=imperisoft.io', 'WRITE=denied', 'NDA=active',
      'CAPACITY=one_engagement', 'NEXT_STEP=' + MAIL,
    ],
  }

  /* ---------- evaluation (returns lines; null = handled its own output) ---------- */

  function evalText(text) {
    const lower = text.toLowerCase()
    if (lower === 'clear') { out.innerHTML = ''; return [] }
    if (COMMANDS[lower]) return COMMANDS[lower]()

    const [head, ...rest] = text.split(/\s+/)
    const arg = rest.join(' ')
    const h = head.toLowerCase()

    if (h === 'ls') return ls(arg)
    if (h === 'cd') return cd(arg)
    if (h === 'cat') return cat(rest)
    if (h === 'tree') return tree()
    if (h === 'nano' || h === 'pico') return nano(arg)
    if (h === 'echo') return [esc(arg) || '']
    if (h === 'head' || h === 'tail') {
      const { lines, err } = fileLines(arg.replace(/^-n\s*\d+\s*/, ''), h)
      if (err) return err
      return h === 'head' ? lines.slice(0, 4) : lines.slice(-4)
    }
    if (h === 'less' || h === 'more') {
      const { lines, err } = fileLines(arg, h)
      if (err) return err
      return [...lines, '<span class="dim">(END)</span>']
    }
    if (h === 'grep') {
      const [pattern, file] = rest
      if (!pattern) return ['usage: grep &lt;pattern&gt; &lt;file&gt;  <span class="dim">(or pipe into me)</span>']
      if (!file) return ['grep: ' + esc(pattern) + ': <span class="dim">grep needs a file, or a pipe.</span>']
      const { lines, err } = fileLines(file, 'grep')
      if (err) return err
      return grepLines(lines, pattern)
    }
    if (h === 'wc') {
      const { lines, err } = fileLines(arg.replace(/^-\w+\s*/, ''), 'wc')
      if (err) return err
      const textOnly = lines.map(strip).join('\n')
      return [`  ${lines.length}  ${textOnly.split(/\s+/).filter(Boolean).length}  ${textOnly.length}  ${esc(arg)}`]
    }
    if (h === 'file') {
      const node = nodeAt(resolve(arg))
      if (node === undefined) return [`file: ${esc(arg)}: no such file`]
      if (isDir(node)) return [`${esc(arg)}: directory`]
      if (arg.endsWith('.enc')) return [`${esc(arg)}: data <span class="dim">(encrypted — see cat)</span>`]
      return [`${esc(arg)}: ASCII text <span class="dim">(honest, like everything here)</span>`]
    }
    if (h === 'man') return [`No manual entry for ${esc(arg || 'man')}. <span class="dim">The manual is a conversation:</span> ` + MAIL]
    if (h === 'which') {
      const known = COMMANDS[arg?.toLowerCase()] ||
        ['vim', 'vi', 'nano', 'grep', 'head', 'tail', 'less', 'wc', 'file', 'man', 'ls', 'cat', 'cd', 'tree', 'ssh', 'curl'].includes(arg?.toLowerCase())
      return known ? [`/usr/bin/${esc(arg)}`] : [`which: no ${esc(arg || '?')} in (/usr/bin:/home/guest/patience)`]
    }
    if (h === 'ssh') {
      if (/motoshift/.test(arg)) return ['<span class="dim">connection redirected →</span> <a href="https://motoshift.uk">motoshift.uk</a>']
      if (/root@/.test(arg)) return ['ssh: <span class="dim">root@imperisoft.io: publickey only. yours isn’t on here. yet.</span>']
      return ['ssh: <span class="dim">this is the only session you’re getting.</span>']
    }
    if (h === 'curl' || h === 'wget') {
      if (/motoshift/.test(arg)) return ['HTTP/2 200', '<span class="dim">server: alive, and taking payments →</span> <a href="https://motoshift.uk">motoshift.uk</a>']
      if (/imperisoft/.test(arg) || !arg) return ['<span class="dim">you’re already here.</span>']
      return ['curl: (6) <span class="dim">the outside world is overrated.</span>']
    }
    if (['touch', 'mkdir', 'rm', 'mv', 'cp', 'chmod', 'chown', 'tee', 'dd', 'ln'].includes(h)) return READONLY(h)
    if (h === 'uname') return ['Imperisoft imperisoft.io 6.0-prod #2026 always-on x86_64 <span class="dim">GNU/keep-your-word</span>']
    if (h === 'df') return [
      'Filesystem      Size  Used Avail Use% Mounted on',
      'trust           100%  earned  —  100% /',
      'patience         ∞     some   ∞    1% /home/guest',
    ]
    if (h === 'sudo') return ['sudo: ' + esc(arg || '?') + ': <span class="dim">ambition noted.</span> <span class="cmdlink" data-cmd="sudo hire">sudo hire</span> <span class="dim">is the one that works.</span>']

    return null
  }

  function grepLines(lines, pattern) {
    const safe = pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    const hits = lines
      .map(strip)
      .filter((l) => l.toLowerCase().includes(pattern.toLowerCase()))
      .map((l) => esc(l).replace(new RegExp('(' + safe + ')', 'ig'), '<span class="acc">$1</span>'))
    return hits.length ? hits : ['<span class="dim">grep: no matches. the interesting things aren’t greppable.</span>']
  }

  /* ---------- engine ---------- */

  function print(lines) {
    if (!lines.length) return
    const div = document.createElement('div')
    div.innerHTML = lines.join('\n') + '\n\n'
    out.appendChild(div)
    body.scrollTop = body.scrollHeight
  }

  function echoPrompt(text) {
    print(['<span class="ok">guest@<span class="acc">imperisoft</span>:' + esc(cwdStr()) + '$</span> ' + esc(text)])
  }

  function run(raw) {
    let text = raw.trim()
    if (text === '!!') text = history[history.length - 1] || ''
    echoPrompt(raw.trim() === '!!' && text ? text : raw.trim())
    if (!text) return
    history.push(text)
    if (history.length > 100) history = history.slice(-100)
    store.set('ims-history', JSON.stringify(history))
    historyAt = history.length

    if (inVim) {
      if (text === ':w' || text === ':w!' || text === ':x') {
        return print(['<span class="dim">E45: ’readonly’ option is set — writing is not permitted on this host.</span>'])
      }
      if (text === ':q!' || text === ':q' || text === ':wq') {
        inVim = false
        const note = text === ':wq' ? ' <span class="dim">(nothing was written. it never is.)</span>' : ''
        return print(['<span class="ok">you escaped.</span> <span class="dim">respect.</span>' + note])
      }
      return print(['<span class="dim">E37: no write since last change —</span> :q! <span class="dim">to escape. everyone forgets.</span>'])
    }

    const vimMatch = text.match(/^(vim|vi)(?:\s+(\S+))?$/i)
    if (vimMatch) {
      const shown = []
      if (vimMatch[2]) {
        const { lines, err } = fileLines(vimMatch[2], 'vim')
        if (err) return print(err)
        shown.push(...lines, '')
      }
      inVim = true
      return print([...shown, '<span class="dim">-- INSERT --   (you know how this ends)</span>'])
    }
    if (text === 'emacs') return print(['<span class="dim">emacs is an operating system. this is a website.</span>'])

    if (text.includes('>')) {
      const target = text.split('>').pop().trim() || 'that'
      return print([`zsh: ${esc(target)}: <span class="dim">read-only filesystem. writing is not permitted on this host.</span>`])
    }

    // One honest pipe: anything | grep pattern.
    const pipeAt = text.indexOf('|')
    if (pipeAt !== -1) {
      const left = text.slice(0, pipeAt).trim()
      const right = text.slice(pipeAt + 1).trim()
      const gm = right.match(/^grep\s+(\S+)$/i)
      if (!gm) return print(['zsh: <span class="dim">the only pipe on this host flows into</span> grep<span class="dim">.</span>'])
      const lines = left ? evalText(left) : null
      if (lines === null) return print([`zsh: command not found: ${esc(left.split(/\s+/)[0])}`])
      return print(grepLines(lines, gm[1]))
    }

    const lines = evalText(text)
    if (lines !== null) {
      print(lines)
      curiosity(text)
      return
    }
    print([`zsh: command not found: ${esc(text.split(/\s+/)[0])}`, '<span class="dim">try</span> <span class="cmdlink" data-cmd="help">help</span>'])
  }

  /* The machine notices sustained curiosity, once. */
  function curiosity(text) {
    seen.add(text.split(/\s+/)[0].toLowerCase())
    if (!noticed && seen.size >= 8) {
      noticed = true
      store.set('ims-noticed', '1')
      setTimeout(() => print([
        '<span class="dim">broadcast message from root@imperisoft:</span>',
        '<span class="dim">  eight commands in. most visitors manage two.</span>',
        '<span class="dim">  you’d fit right in →</span> ' + MAIL,
      ]), 600)
    }
  }

  /* ---------- input ---------- */

  cmd.addEventListener('keydown', (e) => {
    if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
      e.preventDefault(); out.innerHTML = ''; return
    }
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && !getSelection().toString()) {
      e.preventDefault()
      print(['<span class="ok">guest@<span class="acc">imperisoft</span>:' + esc(cwdStr()) + '$</span> ' + esc(cmd.value) + '^C'])
      cmd.value = ''
      if (inVim) { inVim = false; print(['<span class="dim">vim: interrupted. lucky.</span>']) }
      return
    }
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); cmd.value = ''; return }
    if (e.key === 'Enter') { run(cmd.value); cmd.value = '' }
    else if (e.key === 'ArrowUp') { if (historyAt > 0) cmd.value = history[--historyAt]; e.preventDefault() }
    else if (e.key === 'ArrowDown') {
      cmd.value = historyAt < history.length - 1 ? history[++historyAt] : ((historyAt = history.length), '')
      e.preventDefault()
    } else if (e.key === 'Tab') {
      e.preventDefault()
      const value = cmd.value
      if (!value) return
      const parts = value.split(/\s+/)
      const token = parts[parts.length - 1]
      // Path-aware: complete the last segment against its parent directory.
      const slash = token.lastIndexOf('/')
      const dirPart = slash === -1 ? '' : token.slice(0, slash + 1)
      const partial = token.slice(slash + 1).toLowerCase()
      const parent = nodeAt(resolve(dirPart || '.')) || {}
      const dirNames = isDir(parent) ? Object.keys(parent) : []
      const pool = parts.length === 1 && slash === -1
        ? [...Object.keys(COMMANDS), 'vim', 'nano', 'grep', 'tree', ...dirNames]
        : dirNames
      const match = [...new Set(pool)].filter((c) => c.toLowerCase().startsWith(partial))
      if (match.length === 1) {
        const completed = dirPart + match[0] + (isDir(parent[match[0]]) ? '/' : '')
        parts[parts.length - 1] = completed
        cmd.value = parts.join(' ')
      } else if (match.length > 1) print(['<span class="dim">' + match.map(esc).join('   ') + '</span>'])
    }
  })

  body.addEventListener('click', () => {
    if (!getSelection().toString()) cmd.focus()
  })
  document.addEventListener('click', (e) => {
    const link = e.target.closest('.cmdlink, .chips button')
    if (link) { run(link.dataset.cmd); cmd.focus() }
  })

  /* ---------- boot ---------- */

  print([
    returning
      ? '<span class="dim">imperisoft.io — session resumed. we remembered. we always do.</span>'
      : '<span class="dim">imperisoft.io — session opened. this terminal is real; so is the work.</span>',
    '',
  ])
  const intro = 'help'
  if (reduced || returning) { run(intro) }
  else {
    let i = 0
    const type = () => {
      if (i <= intro.length) {
        cmd.value = intro.slice(0, i++)
        setTimeout(type, 65 + Math.random() * 60)
      } else {
        setTimeout(() => { run(intro); cmd.value = '' }, 220)
      }
    }
    setTimeout(type, 500)
  }
  cmd.focus()
})()
</script>
</body>
</html>
